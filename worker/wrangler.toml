name = "momentum-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Scheduler runs every minute.
[triggers]
crons = ["* * * * *"]

# KV namespace storing device subscriptions + their schedules.
# Create once:  wrangler kv namespace create SUBS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SUBS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
VAPID_SUBJECT = "mailto:you@example.com"
# VAPID_PUBLIC is public — safe to keep here. Paste your generated public key:
VAPID_PUBLIC = "PASTE_YOUR_VAPID_PUBLIC_KEY_HERE"
# VAPID_PRIVATE must be a secret:  wrangler secret put VAPID_PRIVATE
