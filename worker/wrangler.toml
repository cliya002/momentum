name = "momentum-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Scheduler runs every minute.
[triggers]
crons = ["* * * * *"]

# KV namespace storing device subscriptions + their schedules.
# Create once:  wrangler kv namespace create SUBS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SUBS"
id = "cbf51b852e1f43169bbc17bbbb993162"

[vars]
VAPID_SUBJECT = "mailto:you@example.com"
# VAPID_PUBLIC is public — safe to keep here.
VAPID_PUBLIC = "BBReZYer2vjuAyAu2fIgfRqbYYtFEoXIJglplLTJ6Wi1nbIdWqpy4pVorgUm7_bhVDt_SuyPDudtYz0wPwJPiBU"
# VAPID_PRIVATE must be a secret:  wrangler secret put VAPID_PRIVATE
